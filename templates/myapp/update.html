<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<style>
		body{
			background-image: linear-gradient(to right,#E2A16F,#FFF0DD);

		}
		h1{
			color: darkred;
		}
		form{
			color: darkred;
		}
		input{
			color: darkred	;
		}
		button{
			color: ghostwhite;
			background-image: linear-gradient(darkred);
			height: 35px;
			width: 80px;
			font-size: 15px;
		}
	</style>
</head>
<body>
	<center>
		<h1>Updation Form</h1>
		<form method="post">
			title:<input type="text" name="title" value={{stud.title}}>
			<br><br>
			description:<input type="text" name="description" value={{stud.description}}>
			<br><br>
			email:<input type="email" name="email" value={{stud.email}}>
			<br><br>
			place:<input type="text" name="place" value={{stud.place}}>
			<br><br>
			duedate:<input type="date" name="duedate" value={{stud.duedate}}>
			<br><br>
			status:<input type="text" name="status" value={{stud.status}}>
			<br><br>
			{% csrf_token %}
			<button>submit</button>
		</form>
	</center>
</body>
</html>
